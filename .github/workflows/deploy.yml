name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prebuild auto-generates sitemap/llms)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy out --project-name roguewiki

      - name: Submit IndexNow
        run: |
          KEY=$(cat scripts/indexnow-key.txt)
          python3 - "$KEY" <<'PYEOF'
          import re, json, sys, urllib.request
          key = sys.argv[1]
          sitemap = open('out/sitemap.xml', encoding='utf-8').read()
          urls = re.findall(r'<loc>([^<]+)</loc>', sitemap)
          payload = json.dumps({
            "host": "roguewiki.com", "key": key,
            "keyLocation": f"https://roguewiki.com/indexnow-{key}.txt",
            "urlList": urls,
          }).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload,
            headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow {resp.status} ({len(urls)} URLs)")
          except Exception as e:
              print(f"IndexNow failed (non-fatal): {e}")
          PYEOF
